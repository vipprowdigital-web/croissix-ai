# .github/workflows/frontend-image.yml
#
# Builds the mobile_app (frontend) Docker image on GitHub's servers instead of
# on the VPS, pushes it to GitHub Container Registry, then asks Coolify to
# pull and restart it. The VPS never runs `next build`.

name: Frontend image

on:
  push:
    branches: [main]
    paths:
      - "mobile_app/**"
      - ".github/workflows/frontend-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The NEXT_PUBLIC_* variables are stored in the "Production" environment
    environment: Production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/croissix-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./mobile_app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are public values baked into the browser bundle.
          # Define them under Settings > Secrets and variables > Actions > Variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ vars.NEXT_PUBLIC_FRONTEND_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_RAZORPAY_PLAN_ID_STARTER=${{ vars.NEXT_PUBLIC_RAZORPAY_PLAN_ID_STARTER }}
            NEXT_PUBLIC_RAZORPAY_PLAN_ID_PRO=${{ vars.NEXT_PUBLIC_RAZORPAY_PLAN_ID_PRO }}
            NEXT_PUBLIC_RAZORPAY_PLAN_ID_CROISSIX=${{ vars.NEXT_PUBLIC_RAZORPAY_PLAN_ID_CROISSIX }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Coolify secrets may also live in the "Production" environment
    environment: Production
    steps:
      # Tell Coolify to pull the new image and restart the app.
      # Coolify versions differ on whether /deploy takes GET or POST, so try
      # POST first and fall back to GET only if the server answers 405.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          url="${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
          for method in POST GET; do
            code=$(curl -sS -o response.txt -w "%{http_code}" -X "$method"               -H "Authorization: Bearer ${COOLIFY_TOKEN}"               -H "Accept: application/json" "$url") || code=000
            echo "$method -> HTTP $code"
            cat response.txt; echo
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then exit 0; fi
            [ "$code" = "405" ] || break
          done
          exit 1
